
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Salsa Forever ❤️</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  overflow-x: hidden;
  text-align: center;
  color: white;
  font-family: Arial, sans-serif;
  background:
    radial-gradient(ellipse at top, #421052, #100d2b 60%, #050510);
}

header {
  padding: 35px 15px 0;
}

.eyebrow {
  color: #ffc879;
  letter-spacing: 5px;
  font-size: 11px;
}

h1 {
  font-size: clamp(38px, 10vw, 70px);
  margin: 15px 0;
  text-shadow: 0 0 20px #ff4fa3;
}

h1 span {
  color: #ff79bd;
}

.subtitle {
  color: #d9c8f2;
  letter-spacing: 3px;
  font-size: 12px;
}

.stars {
  position: fixed;
  inset: 0;
  pointer-events: none;
  opacity: .4;
  background-image:
    radial-gradient(white 1px, transparent 1px),
    radial-gradient(#d6a8ff 1px, transparent 1px);
  background-size: 65px 65px, 100px 100px;
  animation: sky 30s linear infinite;
}

@keyframes sky {
  to {
    background-position: 300px 400px, -200px 250px;
  }
}
</style>
</head>

<body>
<div class="stars"></div>

<header>
  <div class="eyebrow">A LITTLE MAGIC AFTER DARK</div>
  <h1>SALSA <span>FOREVER</span> ♡</h1>
  <div class="subtitle">TWO HEARTS · ONE RHYTHM</div>
</header>

</body>
</html>

<style>
.stage {
  position: relative;
  height: 330px;
  max-width: 500px;
  margin: 15px auto;
  overflow: hidden;
}

.moon {
  position: absolute;
  width: 200px;
  height: 200px;
  top: 20px;
  left: 50%;
  transform: translateX(-50%);
  border-radius: 50%;
  background: #bd68ff18;
  box-shadow: 0 0 70px #a855f755;
}

.floor {
  position: absolute;
  bottom: 18px;
  left: 5%;
  right: 5%;
  height: 65px;
  border-radius: 50%;
  background: radial-gradient(
    ellipse, #ff4fa355, transparent 70%
  );
  border-bottom: 2px solid #ff79bd88;
}

.dancer {
  position: absolute;
  bottom: 65px;
  width: 110px;
  height: 235px;
  transform-origin: 50% 90%;
}

.boy {
  left: calc(50% - 115px);
  animation: boyDance 1.4s ease-in-out infinite;
}

.girl {
  left: calc(50% + 5px);
  animation: girlDance 1.4s ease-in-out infinite;
}

@keyframes boyDance {
  0%,100% { transform: translateX(0) rotate(-5deg); }
  25% { transform: translate(-10px,-5px) rotate(5deg); }
  50% { transform: translate(3px,0) rotate(8deg); }
  75% { transform: translate(10px,-4px) rotate(-2deg); }
}

@keyframes girlDance {
  0%,100% { transform: translateX(0) rotate(6deg); }
  25% { transform: translate(10px,-6px) rotate(-8deg); }
  50% { transform: translate(-4px,0) rotate(-12deg); }
  75% { transform: translate(-10px,-4px) rotate(2deg); }
}

.head {
  position: absolute;
  top: 5px;
  left: 35px;
  width: 42px;
  height: 46px;
  border-radius: 50%;
  background: linear-gradient(110deg,#e8ad85,#874d39);
  z-index: 2;
}

.hair {
  position: absolute;
  top: 0;
  left: 31px;
  width: 49px;
  height: 20px;
  border-radius: 50% 50% 20% 20%;
  background: #17101e;
  z-index: 3;
}

.girl .hair {
  top: -5px;
  left: 26px;
  width: 60px;
  height: 38px;
  border-radius: 50%;
  box-shadow: 8px 10px 0 #17101e,
             -5px 12px 0 #17101e;
}

.body {
  position: absolute;
  top: 48px;
  left: 20px;
  width: 75px;
  height: 85px;
  border-radius: 20px 20px 8px 8px;
  background: linear-gradient(90deg,#171525,#51435f,#171525);
}

.girl .body {
  background: linear-gradient(90deg,#a20f51,#ff4fa3,#87103d);
  clip-path: polygon(10% 0,90% 0,100% 75%,
                     70% 100%,30% 100%,0 75%);
}

.arm {
  position: absolute;
  top: 58px;
  left: 76px;
  width: 13px;
  height: 85px;
  border-radius: 12px;
  background: #d99570;
  transform-origin: top center;
  animation: armDance .65s ease-in-out infinite alternate;
}

.arm.two {
  left: 23px;
  animation-delay: -.65s;
}

@keyframes armDance {
  from { transform: rotate(-35deg); }
  to { transform: rotate(35deg); }
}

.leg {
  position: absolute;
  top: 125px;
  left: 35px;
  width: 20px;
  height: 95px;
  border-radius: 10px;
  background: #282032;
  transform-origin: top center;
  animation: footwork .55s ease-in-out infinite alternate;
}

.leg.two {
  left: 60px;
  animation-delay: -.55s;
}

.girl .leg {
  background: linear-gradient(#ff4fa3,#a20f51);
}

@keyframes footwork {
  from { transform: rotate(-18deg); }
  to { transform: rotate(18deg) translateY(-5px); }
}

.shoe {
  position: absolute;
  bottom: 0;
  left: 30px;
  width: 38px;
  height: 10px;
  border-radius: 50%;
  background: #ffc879;
}

.spark {
  position: absolute;
  color: #ffc879;
  font-size: 24px;
  animation: sparkle 1.8s ease-in-out infinite;
}

.s1 { top: 30px; left: 12%; }
.s2 { top: 100px; right: 12%; animation-delay: -.8s; }

@keyframes sparkle {
  50% { opacity: .25; transform: scale(1.5) rotate(45deg); }
}

.note {
  color: #d9c8f2;
  font-size: 13px;
  margin: 0 12px 20px;
  letter-spacing: 1px;
}
</style>

<section class="stage">
  <div class="moon"></div>
  <div class="spark s1">✦</div>
  <div class="spark s2">✧</div>

  <div class="dancer boy">
    <div class="hair"></div>
    <div class="head"></div>
    <div class="body"></div>
    <div class="arm"></div>
    <div class="arm two"></div>
    <div class="leg"></div>
    <div class="leg two"></div>
    <div class="shoe"></div>
  </div>

  <div class="dancer girl">
    <div class="hair"></div>
    <div class="head"></div>
    <div class="body"></div>
    <div class="arm"></div>
    <div class="arm two"></div>
    <div class="leg"></div>
    <div class="leg two"></div>
    <div class="shoe"></div>
  </div>

  <div class="floor"></div>
</section>

<p class="note">
  Let the music speak. Let the world disappear. ✨
</p>

<style>
.player {
  max-width: 370px;
  margin: 20px auto;
  padding: 22px;
  border: 1px solid #ffffff25;
  border-radius: 22px;
  background: #ffffff0c;
  box-shadow: 0 0 35px #a855f722;
}

.track-title {
  font-size: 15px;
  font-weight: bold;
  letter-spacing: 1px;
}

.track-subtitle {
  color: #c6b4dc;
  font-size: 12px;
  margin-top: 7px;
}

.controls {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 20px;
  margin: 20px 0;
}

.controls button {
  width: 46px;
  height: 46px;
  border-radius: 50%;
  border: 1px solid #ff79bd88;
  background: #ff4fa322;
  color: white;
  font-size: 19px;
}

.controls .main-button {
  width: 60px;
  height: 60px;
  background: linear-gradient(135deg,#ff4fa3,#9055ff);
  border: none;
  box-shadow: 0 0 25px #ff4fa355;
  font-size: 23px;
}

.player input[type="range"] {
  width: 100%;
  accent-color: #ff79bd;
}

.time {
  display: flex;
  justify-content: space-between;
  color: #c6b4dc;
  font-size: 11px;
  margin-top: 8px;
}

#status {
  color: #e5cbed;
  font-size: 12px;
  line-height: 1.5;
  margin-bottom: 0;
}
</style>

<section class="player">
  <div class="track-title">♫ OUR SPECIAL SONG</div>
  <div class="track-subtitle">
    Press play and let's dance ❤️
  </div>

  <div class="controls">
    <button id="restart" aria-label="Restart song">↺</button>
    <button id="play" class="main-button" aria-label="Play music">▶</button>
    <button id="mute" aria-label="Mute music">♫</button>
  </div>

  <input id="progress" type="range"
         min="0" max="100" value="0"
         aria-label="Song progress">

  <div class="time">
    <span id="elapsed">0:00</span>
    <span id="duration">0:00</span>
  </div>

  <p style="font-size:11px;color:#c6b4dc">VOLUME</p>
  <input id="volume" type="range"
         min="0" max="1" step="0.05" value="0.8"
         aria-label="Volume">

  <audio id="song" preload="metadata" loop>
    <source src="neon-track.mp3" type="audio/mpeg">
  </audio>

  <p id="status">
    Ready for our first dance? 🎶
  </p>
</section>

<p class="note">
  Some people hear music. Some people become the music. ❤️
</p>

<!-- PART 4 GOES HERE -->

<script>
const song = document.getElementById("song");
const playBtn = document.getElementById("play");
const muteBtn = document.getElementById("mute");
const progress = document.getElementById("progress");
const volume = document.getElementById("volume");
const elapsed = document.getElementById("elapsed");
const duration = document.getElementById("duration");
const status = document.getElementById("status");

function formatTime(seconds) {
  if (!Number.isFinite(seconds)) return "0:00";

  const minutes = Math.floor(seconds / 60);
  const secs = String(Math.floor(seconds % 60)).padStart(2, "0");

  return minutes + ":" + secs;
}

playBtn.addEventListener("click", async () => {
  if (song.paused) {
    try {
      await song.play();
      playBtn.textContent = "Ⅱ";
      status.textContent = "Our song is playing. Let's dance! ❤️";
    } catch (error) {
      status.textContent =
        "Music not found. Check that neon-track.mp3 is beside index.html.";
    }
  } else {
    song.pause();
    playBtn.textContent = "▶";
    status.textContent = "Paused. Our dance can wait. ❤️";
  }
});

document.getElementById("restart").addEventListener("click", () => {
  song.currentTime = 0;

  if (!song.paused) {
    song.play().catch(() => {});
  }
});

muteBtn.addEventListener("click", () => {
  song.muted = !song.muted;
  muteBtn.textContent = song.muted ? "🔇" : "♫";
});

volume.addEventListener("input", () => {
  song.volume = Number(volume.value);
  song.muted = false;
  muteBtn.textContent = "♫";
});

song.addEventListener("loadedmetadata", () => {
  duration.textContent = formatTime(song.duration);
});

song.addEventListener("timeupdate", () => {
  elapsed.textContent = formatTime(song.currentTime);

  if (Number.isFinite(song.duration) && song.duration > 0) {
    progress.value = (song.currentTime / song.duration) * 100;
  }
});

progress.addEventListener("input", () => {
  if (Number.isFinite(song.duration) && song.duration > 0) {
    song.currentTime =
      (Number(progress.value) / 100) * song.duration;
  }
});

song.addEventListener("error", () => {
  status.textContent =
    "Upload neon-track.mp3 into the same folder as index.html.";
});

song.addEventListener("play", () => {
  playBtn.textContent = "Ⅱ";
});

song.addEventListener("pause", () => {
  playBtn.textContent = "▶";
});

</script>
</body>
</html>
